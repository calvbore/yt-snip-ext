<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yt-snip settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <h1>yt-snip settings</h1>

    <form id="settings">
      <label class="field">
        <span class="field-label">Frames per second</span>
        <input type="number" id="fps" min="1" max="60" step="1" required>
        <span class="hint">Capture rate of the saved clip (1–60).</span>
      </label>

      <label class="field">
        <span class="field-label">Max dimension (px)</span>
        <input type="number" id="maxDimension" min="64" max="8000" step="1" required>
        <span class="hint">Long edge of the output. The short edge scales with the crop so Anki stays happy.</span>
      </label>

      <label class="field">
        <span class="field-label">Format</span>
        <span class="field-row" role="radiogroup" aria-label="Output format">
          <label class="check radio">
            <input type="radio" name="format" id="formatWebm" value="webm">
            <span class="field-label">WebM (recommended)</span>
            <span class="hint">Truecolor VP9 video. Full color — no 256-color GIF palette. Plays in AnkiDroid; AnkiMobile needs iOS 17.4+.</span>
          </label>
          <label class="check radio">
            <input type="radio" name="format" id="formatGif" value="gif">
            <span class="field-label">GIF</span>
            <span class="hint">Universally compatible (and auto-looping), but capped at 256 colors per frame. Larger files at high quality.</span>
          </label>
        </span>
      </label>

      <label class="field check">
        <input type="checkbox" id="dither">
        <span class="field-label">Dither GIF colors</span>
        <span class="hint">Error-diffusion dithering for GIF output — removes banding on smooth gradients. No effect on WebM.</span>
      </label>

      <label class="field check">
        <input type="checkbox" id="saveAs">
        <span class="field-label">Ask where to save each clip</span>
      </label>

      <label class="field check">
        <input type="checkbox" id="loopOnPlay">
        <span class="field-label">Loop the selection when I press play</span>
        <span class="hint">While snipping, starting playback loops within your clip for previewing. Turn off to loop only via the Loop button.</span>
      </label>

      <label class="field">
        <span class="field-label">Selection start padding (s)</span>
        <input type="number" id="clipPadStart" min="0" max="600" step="1" required>
        <span class="hint">When you open the tool, the start handle is placed this many seconds before where the video was (0–600).</span>
      </label>

      <label class="field">
        <span class="field-label">Selection end padding (s)</span>
        <input type="number" id="clipPadEnd" min="0" max="600" step="1" required>
        <span class="hint">…and the end handle this many seconds after it.</span>
      </label>

      <div class="actions">
        <button type="submit" class="primary">Save</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
  <script src="../lib/options.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
